<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sutra Health - Archive</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   SUTRA HEALTH VIDEO GALLERY
   ========================================================= */

.sh-gallery{
  --sh-teal-900:#0b4a45;
  --sh-teal-700:#0F766E;
  --sh-teal-500:#1a9e94;
  --sh-teal-100:#e6f4f2;
  --sh-sand-50:#f6f8fa;
  --sh-ink-900:#1c2b2a;
  --sh-ink-500:#6b7c7a;
  --sh-line:#e6ebe9;
  --sh-amber:#f2a341;
  --sh-gold:#d4af6a;

  font-family:'Inter',sans-serif;
  background:var(--sh-sand-50);
  color:var(--sh-ink-900);
  display:block;
  width:100%;
}

.sh-gallery,
.sh-gallery *{
  box-sizing:border-box;
}

.sh-gallery p,
.sh-gallery h1,
.sh-gallery h2,
.sh-gallery h3{
  margin:0;
  padding:0;
}

/* =========================================================
   HERO
   ========================================================= */

.sh-gallery .sh-hero{
  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(212,175,106,.20),
      transparent 45%
    ),
    radial-gradient(
      circle at 85% 25%,
      rgba(255,255,255,.14),
      transparent 50%
    ),
    linear-gradient(
      135deg,
      var(--sh-teal-900) 0%,
      var(--sh-teal-700) 55%,
      var(--sh-teal-500) 100%
    );

  color:#fff;
  padding:76px 20px 68px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.sh-gallery .sh-hero::before{
  content:"";
  position:absolute;
  inset:0;

  background-image:
    linear-gradient(
      rgba(255,255,255,.05) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.05) 1px,
      transparent 1px
    );

  background-size:36px 36px;

  mask-image:
    radial-gradient(
      circle at 50% 0%,
      rgba(0,0,0,.6),
      transparent 70%
    );
}

.sh-gallery .sh-hero-eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;

  font-size:12.5px;
  letter-spacing:.16em;
  text-transform:uppercase;

  color:var(--sh-gold);
  font-weight:600;

  margin-bottom:14px;

  position:relative;
}

.sh-gallery .sh-hero-eyebrow::before,
.sh-gallery .sh-hero-eyebrow::after{
  content:"";

  width:22px;
  height:1px;

  background:var(--sh-gold);
  opacity:.7;
}

.sh-gallery .sh-hero h1{
  font-family:'Playfair Display',serif;

  font-size:clamp(
    32px,
    4.4vw,
    48px
  );

  margin-bottom:14px;

  letter-spacing:-.01em;
  line-height:1.18;

  position:relative;
  color:#fff;
}

.sh-gallery .sh-hero-sub{
  opacity:.92;

  font-size:17px;
  color:#eafaf7;

  max-width:650px;

  margin:0 auto;

  line-height:1.6;

  position:relative;
}

.sh-gallery .sh-hero-actions{
  position:relative;

  margin-top:30px;

  display:flex;
  justify-content:center;
}

.sh-gallery .sh-archive-link{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.97);

  color:var(--sh-teal-900);

  font-weight:600;
  font-size:14.5px;

  padding:12px 22px;

  border-radius:999px;

  text-decoration:none;

  box-shadow:
    0 8px 22px rgba(0,0,0,.18);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.sh-gallery .sh-archive-link:hover{
  transform:translateY(-2px);

  box-shadow:
    0 12px 28px rgba(0,0,0,.24);
}

/* =========================================================
   CONTAINER
   ========================================================= */

.sh-gallery .sh-container{
  max-width:1240px;

  margin:0 auto;

  padding:54px 20px 64px;

  width:100%;
}

/* =========================================================
   SYNC BAR
   ========================================================= */

.sh-gallery .sh-sync-bar{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:10px;

  margin-bottom:42px;

  font-size:14px;

  color:var(--sh-ink-500);

  flex-wrap:wrap;
}

.sh-gallery .sh-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:
    0 0 0 4px rgba(34,197,94,.15);

  display:inline-block;
}

.sh-gallery .sh-dot.loading{
  background:var(--sh-amber);

  box-shadow:
    0 0 0 4px rgba(242,163,65,.18);

  animation:sh-pulse 1.2s infinite;
}

.sh-gallery .sh-dot.error{
  background:#ef4444;

  box-shadow:
    0 0 0 4px rgba(239,68,68,.15);
}

@keyframes sh-pulse{
  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.4;
  }
}

.sh-gallery .sh-refresh-btn{
  border:1px solid var(--sh-line);

  background:#fff;

  color:var(--sh-teal-700);

  font-weight:600;

  font-size:13px;

  padding:7px 16px;

  border-radius:20px;

  cursor:pointer;

  transition:
    background .15s ease,
    color .15s ease,
    box-shadow .15s ease;
}

.sh-gallery .sh-refresh-btn:hover{
  background:var(--sh-teal-700);

  color:#fff;

  box-shadow:
    0 6px 16px rgba(15,118,110,.25);
}

/* =========================================================
   CATEGORY
   ========================================================= */

.sh-category{
  margin-bottom:56px;
}

.sh-category-head{
  display:flex;

  justify-content:space-between;
  align-items:flex-end;

  gap:20px;

  margin-bottom:18px;
}

.sh-category-title{
  color:var(--sh-teal-900);

  font-family:'Playfair Display',serif;

  font-size:28px;

  line-height:1.2;
}

.sh-category-subtitle{
  margin-top:6px !important;

  color:var(--sh-ink-500);

  font-size:13px;
}

/* =========================================================
   GRID
   ========================================================= */

.sh-category-grid{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:18px;
}

/* =========================================================
   CARD
   ========================================================= */

.sh-video-card{
  background:#fff;

  border-radius:16px;

  padding:10px;

  border:1px solid var(--sh-line);

  box-shadow:
    0 1px 2px rgba(15,118,110,.04),
    0 14px 32px rgba(15,118,110,.09);

  transition:
    transform .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;

  min-width:0;
}

.sh-video-card:hover{
  transform:translateY(-5px);

  border-color:
    rgba(15,118,110,.25);

  box-shadow:
    0 1px 2px rgba(15,118,110,.06),
    0 24px 44px rgba(15,118,110,.16);
}


/* =========================================================
   FOLDER-STYLE ARCHIVE CARD
   ========================================================= */

.sh-gallery .sh-archive-card{
  padding:0;
  overflow:hidden;
}

.sh-gallery .sh-archive-card-link{
  display:block;
  color:inherit;
  text-decoration:none;
}

.sh-gallery .sh-archive-thumb{
  position:relative;
  width:100%;
  aspect-ratio:16 / 10;
  overflow:hidden;
  background:#e9efed;
}

.sh-gallery .sh-archive-thumb img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .35s ease;
}

.sh-gallery .sh-archive-card:hover .sh-archive-thumb img{
  transform:scale(1.045);
}

.sh-gallery .sh-archive-card-body{
  padding:14px 14px 16px;
  background:#fff;
}

.sh-gallery .sh-archive-card-body h3{
  margin:0 !important;
  color:var(--sh-teal-900);
  font-family:'Playfair Display',serif;
  font-size:16px;
  line-height:1.35;
  font-weight:600;
  white-space:normal;
  overflow:hidden;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
}

.sh-gallery .sh-archive-card-subtitle{
  margin:6px 0 0 !important;
  color:var(--sh-ink-500);
  font-size:12px;
  line-height:1.45;
}

.sh-gallery .sh-archive-open{
  position:absolute;
  left:12px;
  bottom:12px;
  z-index:2;
  padding:7px 11px;
  border-radius:999px;
  background:rgba(7,21,20,.78);
  color:#fff;
  font-size:11px;
  font-weight:600;
  backdrop-filter:blur(6px);
  opacity:0;
  transform:translateY(5px);
  transition:opacity .2s ease, transform .2s ease;
}

.sh-gallery .sh-archive-card:hover .sh-archive-open{
  opacity:1;
  transform:translateY(0);
}

.sh-gallery .sh-no-thumbnail{
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(
      135deg,
      var(--sh-teal-900),
      var(--sh-teal-700)
    );
}

.sh-gallery .sh-no-thumbnail::after{
  content:"Sutra Health";
  color:rgba(255,255,255,.9);
  font-family:'Playfair Display',serif;
  font-size:20px;
}

@media(max-width:640px){

  .sh-gallery .sh-archive-open{
    opacity:1;
    transform:none;
  }

}

.sh-video-card h3{
  color:var(--sh-teal-900);

  font-size:14px;

  font-weight:600;

  margin:
    4px 0 10px !important;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

/* =========================================================
   MEDIA
   ========================================================= */

.sh-player{
  position:relative;

  width:100%;

  aspect-ratio:16 / 9;

  overflow:hidden;

  border-radius:14px;

  background:#071514;
}

.sh-player video{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  background:#071514;
}

.sh-player img{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

/* =========================================================
   CUSTOM THUMBNAIL
   ========================================================= */

.sh-custom-thumb{
  position:absolute;

  inset:0;

  z-index:3;

  width:100%;
  height:100%;

  object-fit:cover;

  cursor:pointer;

  transition:
    opacity .25s ease,
    transform .35s ease;
}

.sh-custom-thumb:hover{
  transform:scale(1.025);
}

/* =========================================================
   PLAY BUTTON
   ========================================================= */

.sh-play-overlay{
  position:absolute;

  inset:0;

  z-index:4;

  display:flex;

  align-items:center;
  justify-content:center;

  cursor:pointer;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.02),
      rgba(0,0,0,.28)
    );

  transition:
    background .2s ease;
}

.sh-play-overlay:hover{
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.04),
      rgba(0,0,0,.38)
    );
}

.sh-play-button{
  width:58px;
  height:58px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    rgba(255,255,255,.95);

  color:var(--sh-teal-900);

  font-size:20px;

  padding-left:4px;

  box-shadow:
    0 8px 24px rgba(0,0,0,.30);

  transition:
    transform .18s ease,
    background .18s ease;
}

.sh-play-overlay:hover .sh-play-button{
  transform:scale(1.08);

  background:var(--sh-gold);

  color:#fff;
}

/* =========================================================
   THUMBNAIL LABEL
   ========================================================= */

.sh-thumb-label{
  position:absolute;

  left:10px;
  bottom:10px;

  z-index:5;

  background:
    rgba(0,0,0,.60);

  color:#fff;

  padding:5px 9px;

  border-radius:999px;

  font-size:10px;

  backdrop-filter:blur(5px);
}

/* =========================================================
   FILE NAME
   ========================================================= */

.sh-media-name{
  margin:7px 2px 0;

  color:var(--sh-ink-500);

  font-size:10.5px;

  line-height:1.35;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

/* =========================================================
   MORE BUTTON
   ========================================================= */

.sh-more-wrap{
  display:flex;

  justify-content:center;

  margin-top:22px;
}

.sh-more-btn{
  border:
    1px solid var(--sh-teal-700);

  background:#fff;

  color:var(--sh-teal-700);

  font-weight:600;

  font-size:13px;

  padding:9px 20px;

  border-radius:999px;

  cursor:pointer;

  transition:
    background .18s ease,
    color .18s ease;
}

.sh-more-btn:hover{
  background:var(--sh-teal-700);

  color:#fff;
}

/* =========================================================
   EMPTY / ERROR
   ========================================================= */

.sh-category-empty{
  padding:30px;

  background:#fff;

  border:
    1px dashed var(--sh-line);

  border-radius:16px;

  color:var(--sh-ink-500);

  text-align:center;

  font-size:14px;

  line-height:1.7;
}

.sh-category-empty a{
  color:var(--sh-teal-700);

  font-weight:600;

  text-decoration:none;
}

.sh-category-empty a:hover{
  text-decoration:underline;
}

/* =========================================================
   LOADING
   ========================================================= */

.sh-loading{
  text-align:center;

  padding:40px 20px;

  color:var(--sh-ink-500);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:1000px){

  .sh-category-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

@media(max-width:640px){

  .sh-gallery .sh-hero{
    padding:52px 20px 44px;
  }

  .sh-gallery .sh-hero h1{
    font-size:28px;
  }

  .sh-gallery .sh-container{
    padding:38px 16px 44px;
  }

  .sh-category-grid{
    grid-template-columns:1fr;
  }

  .sh-category-head{
    align-items:flex-start;

    flex-direction:column;
  }

  .sh-player{
    aspect-ratio:16 / 10;
  }
}
</style>
</head>

<body>

<!-- =========================================================
     NAVBAR
     ========================================================= -->

<div id="navbar"></div>


<!-- =========================================================
     GALLERY
     ========================================================= -->

<div class="sh-gallery">

  <!-- HERO -->

  <section class="sh-hero">

    <span class="sh-hero-eyebrow">
      Sutra Health
    </span>

    <h1>
      Sutra Health Archive
    </h1>

    <p class="sh-hero-sub">
      Explore our wellness, lifestyle, clinic and publication resources in one place.
    </p>

    <div class="sh-hero-actions">

      <a
        class="sh-archive-link"
        href="https://archive.org/details/@sutra_health"
        target="_blank"
        rel="noopener"
      >
        Visit Our Archive ↗
      </a>

    </div>

  </section>


  <!-- CONTENT -->

  <div class="sh-container">

    <div class="sh-sync-bar">

      <span
        class="sh-dot loading"
        id="shSyncDot"
      ></span>

      <span id="shSyncText">
        Connecting to Internet Archive…
      </span>

      <button
        class="sh-refresh-btn"
        id="shRefreshBtn"
        type="button"
      >
        ↻ Refresh
      </button>

    </div>


    <div id="shCategoryContainer"></div>

  </div>

</div>


<!-- =========================================================
     FOOTER
     ========================================================= -->

<div id="footer"></div>


<script src="/js/include.js"></script>


<script>
(function(){

/* =========================================================
   CATEGORY CONFIGURATION
   ========================================================= */

const CATEGORIES = [
  {
    title:"Nature",
    subtitle:"Nature and wellness",
    id:"sutra-health-nature",
    url:"https://archive.org/details/sutra-health-nature"
  },
  {
    title:"Lifestyle Pearls",
    subtitle:"Lifestyle and health guidance",
    id:"Lifestyle-pearls",
    url:"https://archive.org/details/Lifestyle-pearls"
  },
  {
    title:"Lifestyle Doctor",
    subtitle:"Doctor and lifestyle content",
    id:"Lifestyle-doctor",
    url:"https://archive.org/details/Lifestyle-doctor"
  },
  {
    title:"Principal Crude Herbal Drugs of India",
    subtitle:"Yoga books and academic resources",
    id:"yoga-books",
    url:"https://archive.org/details/yoga-books/Academic/Principal_Crude_Herbal_Drugs_of_Indi/"
  },
  {
    title:"Sutra Health Brochure",
    subtitle:"Brochures and publications",
    id:"sutra_health",
    url:"https://archive.org/details/sutra_health/Sutra-Health/brochure/"
  },
  {
    title:"Clinic",
    subtitle:"Clinic resources",
    id:"lifestyle_clinic",
    url:"https://archive.org/details/lifestyle_clinic"
  },
  {
    title:"Practitioner Experiences",
    subtitle:"Practitioner and follower experiences",
    id:"lifestyle-practitioners-experience",
    url:"https://archive.org/details/lifestyle-practitioners-experience"
  },

  {
    title:"Lifestyle Food",
    subtitle:"Food and healthy lifestyle",
    id:"sutra_health_lifestyle_food",
    url:"https://archive.org/details/sutra_health_lifestyle_food"
  }
];


/* =========================================================
   SETTINGS
   ========================================================= */

const INITIAL = 4;

const STEP = 4;


/* =========================================================
   DOM
   ========================================================= */

const container =
  document.getElementById("shCategoryContainer");

const dot =
  document.getElementById("shSyncDot");

const statusText =
  document.getElementById("shSyncText");

const refresh =
  document.getElementById("shRefreshBtn");


/* =========================================================
   STATUS
   ========================================================= */

function status(state,message){

  dot.className =
    "sh-dot " + (state || "");

  statusText.textContent =
    message;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function esc(value){

  return String(value || "")
    .replace(/[&<>"']/g,function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"

      }[char];

    });

}


/* =========================================================
   ARCHIVE THUMBNAIL
   ========================================================= */

function archiveThumbUrl(identifier){

  return (
    "https://archive.org/services/img/" +
    encodeURIComponent(identifier)
  );

}


/* =========================================================
   CREATE ONE FOLDER CARD
   ========================================================= */

function makeArchiveCard(category){

  const card =
    document.createElement("article");

  card.className =
    "sh-video-card sh-archive-card";

  card.innerHTML = `

    <a
      class="sh-archive-card-link"
      href="${esc(category.url)}"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open ${esc(category.title)} on Internet Archive"
    >

      <div class="sh-archive-thumb">

        <img
          src="${esc(archiveThumbUrl(category.id))}"
          loading="lazy"
          alt="${esc(category.title)}"
        >

        <span class="sh-archive-open">
          Open Archive ↗
        </span>

      </div>

      <div class="sh-archive-card-body">

        <h3 title="${esc(category.title)}">
          ${esc(category.title)}
        </h3>

        <p class="sh-archive-card-subtitle">
          ${esc(category.subtitle)}
        </p>

      </div>

    </a>

  `;

  const image =
    card.querySelector(".sh-archive-thumb img");

  image.addEventListener(
    "error",
    function(){

      image.style.display = "none";

      card
        .querySelector(".sh-archive-thumb")
        .classList.add("sh-no-thumbnail");

    }
  );

  return card;

}


/* =========================================================
   LOAD 9 ARCHIVE FOLDER CARDS
   ========================================================= */

function load(){

  status(
    "",
    "Archive resources"
  );

  container.innerHTML = "";

  const section =
    document.createElement("section");

  section.className =
    "sh-category";

  section.innerHTML = `

    <div class="sh-category-head">

      <div>

        <h2 class="sh-category-title">
          Sutra Health Archive
        </h2>

        <p class="sh-category-subtitle">
          Explore our folders, publications, videos and wellness resources.
        </p>

      </div>

    </div>

    <div class="sh-category-grid"></div>

  `;

  const grid =
    section.querySelector(".sh-category-grid");

  CATEGORIES.forEach(function(category){

    grid.appendChild(
      makeArchiveCard(category)
    );

  });

  container.appendChild(section);

}


/* =========================================================
   REFRESH
   ========================================================= */

refresh.addEventListener(
  "click",
  load
);


/* =========================================================
   START
   ========================================================= */

load();

})();

</script>

</body>
</html>
