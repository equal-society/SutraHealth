.sh-gallery .sh-hero-eyebrow{

.sh-gallery .sh-hero-sub{

.sh-gallery .sh-archive-link{

/* =========================================================

/* =========================================================
   SYNC BAR
   ========================================================= */

.sh-gallery .sh-sync-bar{

}

.sh-gallery .sh-dot{

}

.sh-gallery .sh-refresh-btn{

/* =========================================================
   CATEGORY

}

.sh-category-head{

}

/* =========================================================

.sh-category-grid{

}

/* =========================================================
   CARD
   ========================================================= */

.sh-video-card{

}

/* =========================================================
   MEDIA
   ========================================================= */

.sh-player{

  width:100%;

  aspect-ratio:16 / 9;

  overflow:hidden;

  border-radius:14px;

  background:#071514;
}

.sh-player video{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  background:#071514;
}

.sh-player img{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

/* =========================================================
   CUSTOM THUMBNAIL
   ========================================================= */

.sh-custom-thumb{
  position:absolute;

  inset:0;

  z-index:3;

  width:100%;
  height:100%;

  object-fit:cover;

  cursor:pointer;

  transition:

}

}

   PLAY BUTTON
   ========================================================= */

.sh-play-overlay:hover{

.sh-play-button{

.sh-play-overlay:hover .sh-play-button{

/* =========================================================
   THUMBNAIL LABEL

  text-overflow:ellipsis;

.sh-more-wrap{

.sh-more-btn{

  color:var(--sh-teal-700);

  font-size:13px;

  padding:9px 20px;

  border-radius:999px;

}

.sh-more-btn:hover{

/* =========================================================
   EMPTY / ERROR

.sh-category-empty{

  border-radius:16px;

.sh-category-empty a:hover{

/* =========================================================

/* =========================================================

  }

    grid-template-columns:1fr;
  }

  .sh-category-head{
    align-items:flex-start;

    flex-direction:column;
  }

  .sh-player{
    aspect-ratio:16 / 10;
  }
}

<script>
(function(){

/* =========================================================
   CATEGORY CONFIGURATION
   ========================================================= */

const CATEGORIES = [



  {
    title:"Yoga",
    subtitle:"Yoga sequences and practice",
    id:"yoga-sequence",

    knownFiles:[
      "Yoga/yoga_asana/2026-06-13_shashankasana.mp4"
    ]
  },



  {
    title:"Lifestyle · Food",
    subtitle:"Food and healthy lifestyle content",
    id:"sutra_health_lifestyle_food",

    knownFiles:[]
  },



  {
    title:"Clinic",
    subtitle:"Clinic videos",
    id:"lifestyle_clinic",

    knownFiles:[
      "Clinic/2025-07-05.mp4"
    ]
  },

  {
    title:"Practitioner Experiences",
    subtitle:"Follower and practitioner experiences",
    id:"lifestyle-practitioners-experience",

    knownFiles:[
      "follower-experience/arthritis_2025-04-09-2.mp4"
    ]
  }

];


/* =========================================================
   CUSTOM THUMBNAILS
   =========================================================

   ADD YOUR OWN THUMBNAIL HERE.

   Format:

   "ArchiveItemID/path/to/video.mp4":
      "/images/gallery/my-thumbnail.jpg"

   Example:

   "yoga-sequence/Yoga/yoga_asana/2026-06-13_shashankasana.mp4":
      "/images/gallery/shashankasana.jpg"

   You can use JPG, PNG or WEBP.

   If you don't add a thumbnail here,
   Internet Archive thumbnail fallback is used.
*/

const CUSTOM_THUMBNAILS = {

  /*
  "yoga-sequence/Yoga/yoga_asana/2026-06-13_shashankasana.mp4":
    "/images/gallery/shashankasana.jpg",

  "lifestyle_clinic/Clinic/2025-07-05.mp4":
    "/images/gallery/clinic-2025-07-05.jpg",

  "lifestyle-practitioners-experience/follower-experience/arthritis_2025-04-09-2.mp4":
    "/images/gallery/arthritis.jpg",

  "30-06-2026_202609/clinic/02-04-2026-2.mp4":
    "/images/gallery/clinic-02-04-2026.jpg",

  "sutra_health_lifestyle_nature/sutra_health_nature_02-07-2026.mp4":
    "/images/gallery/nature-02-07-2026.jpg"
  */

};


/* =========================================================
   SETTINGS
   ========================================================= */

const INITIAL = 4;

const STEP = 4;


/* =========================================================
   DOM
   ========================================================= */

const container =
  document.getElementById("shCategoryContainer");

const dot =
  document.getElementById("shSyncDot");

const statusText =
  document.getElementById("shSyncText");

const refresh =
  document.getElementById("shRefreshBtn");


/* =========================================================
   STATUS
   ========================================================= */

function status(state,message){

  dot.className =
    "sh-dot " + (state || "");

  statusText.textContent =
    message;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function esc(value){

  return String(value || "")
    .replace(/[&<>"']/g,function(char){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"

      }[char];

    });

}


/* =========================================================
   INTERNET ARCHIVE URL
   ========================================================= */

function mediaUrl(identifier,filename){

  return (
    "https://archive.org/download/" +
    encodeURIComponent(identifier) +
    "/" +
    filename
      .split("/")
      .map(encodeURIComponent)
      .join("/")
  );

}


/* =========================================================
   ARCHIVE ITEM URL
   ========================================================= */

function archiveItemUrl(identifier){

  return (
    "https://archive.org/details/" +
    encodeURIComponent(identifier)
  );

}


/* =========================================================
   ARCHIVE THUMBNAIL
   ========================================================= */

function archiveThumbUrl(identifier){

  return (
    "https://archive.org/services/img/" +
    encodeURIComponent(identifier)
  );

}


/* =========================================================
   ARCHIVE THUMBNAIL FILE
   ========================================================= */

function archiveThumbFileUrl(identifier){

  return mediaUrl(
    identifier,
    "__ia_thumb.jpg"
  );

}


/* =========================================================
   FILE TYPE
   ========================================================= */

function isVideo(filename){

  return /\.(mp4|webm|mov|m4v|ogv)$/i
    .test(filename);

}


function isImage(filename){

  return /\.(jpg|jpeg|png|webp|gif|avif)$/i
    .test(filename);

}


/* =========================================================
   GET METADATA
   ========================================================= */

async function getItem(identifier){

  const url =
    "https://archive.org/metadata/" +
    encodeURIComponent(identifier);

  let lastError;

  for(let attempt=0;attempt<3;attempt++){

    try{

      const response =
        await fetch(
          url,
          {
            method:"GET",
            cache:"no-store",
            headers:{
              Accept:"application/json"
            }
          }
        );

      if(!response.ok){

        throw new Error(
          identifier +
          " HTTP " +
          response.status
        );

      }

      const text =
        await response.text();

      if(!text.trim()){

        throw new Error(
          identifier +
          " returned empty response"
        );

      }

      return JSON.parse(text);

    }

    catch(error){

      lastError = error;

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            700 * (attempt + 1)
          )
      );

    }

  }

  throw (
    lastError ||
    new Error(
      "Could not load " +
      identifier
    )
  );

}


/* =========================================================
   GET CUSTOM THUMBNAIL
   ========================================================= */

function getCustomThumbnail(
  identifier,
  filename
){

  const key =
    identifier +
    "/" +
    filename;

  return CUSTOM_THUMBNAILS[key] || null;

}


/* =========================================================
   THUMBNAIL TEST
   ========================================================= */

function testImage(url){

  return new Promise(function(resolve){

    const image =
      new Image();

    image.onload =
      function(){

        resolve(true);

      };

    image.onerror =
      function(){

        resolve(false);

      };

    image.src = url;

  });

}


/* =========================================================
   CREATE VIDEO CARD
   ========================================================= */

function makeVideoCard(
  item,
  file
){

  const identifier =
    item.metadata?.identifier ||
    item.identifier;

  const title =
    item.metadata?.title ||
    identifier;

  const filename =
    file.name
      .split("/")
      .pop();

  const videoUrl =
    mediaUrl(
      identifier,
      file.name
    );

  const customThumbnail =
    getCustomThumbnail(
      identifier,
      file.name
    );


  const card =
    document.createElement("article");

  card.className =
    "sh-video-card";


  card.innerHTML = `

    <h3
      title="${esc(title)}"
    >
      ${esc(title)}
    </h3>

    <div class="sh-player">

      <video
        controls
        playsinline
        preload="metadata"
        poster="${esc(
          customThumbnail ||
          archiveThumbUrl(identifier)
        )}"
      >

        <source
          src="${esc(videoUrl)}"
        >

        Your browser does not support HTML5 video.

      </video>

      <div
        class="sh-fallback-poster"
        style="
          position:absolute;
          inset:0;
          display:none;
          align-items:center;
          justify-content:center;
          text-align:center;
          padding:20px;
          color:#d9efeb;
          font-size:12px;
          background:linear-gradient(
            135deg,
            #0b4a45,
            #123f3c
          );
          z-index:2;
        "
      >
        Video thumbnail unavailable
      </div>

      <div
        class="sh-play-overlay"
        aria-hidden="true"
      >

        <span class="sh-play-button">
          ▶
        </span>

      </div>

      ${
        customThumbnail
        ?
        `<span class="sh-thumb-label">
          Custom thumbnail
        </span>`
        :
        ""
      }

    </div>

    <div
      class="sh-media-name"
      title="${esc(file.name)}"
    >
      ${esc(filename)}
    </div>

  `;


  const video =
    card.querySelector("video");

  const overlay =
    card.querySelector(
      ".sh-play-overlay"
    );

  const fallback =
    card.querySelector(
      ".sh-fallback-poster"
    );


  /* =====================================================
     PLAY OVERLAY
     ===================================================== */

  overlay.addEventListener(
    "click",
    function(){

      overlay.style.display =
        "none";

      video.play()
        .catch(function(){});

    }
  );


  video.addEventListener(
    "play",
    function(){

      overlay.style.display =
        "none";

    }
  );


  video.addEventListener(
    "pause",
    function(){

      if(
        video.currentTime === 0
      ){

        overlay.style.display =
          "flex";

      }

    }
  );


  /* =====================================================
     VIDEO ERROR
     ===================================================== */

  video.addEventListener(
    "error",
    function(){

      fallback.style.display =
        "flex";

      fallback.textContent =
        "Video unavailable — open on Internet Archive ↗";

      fallback.style.cursor =
        "pointer";

      fallback.onclick =
        function(){

          window.open(
            archiveItemUrl(identifier),
            "_blank",
            "noopener"
          );

        };

    }
  );


  return card;

}


/* =========================================================
   CREATE IMAGE CARD
   ========================================================= */

function makeImageCard(
  item,
  file
){

  const identifier =
    item.metadata?.identifier ||
    item.identifier;

  const title =
    item.metadata?.title ||
    identifier;

  const filename =
    file.name
      .split("/")
      .pop();

  const imageUrl =
    mediaUrl(
      identifier,
      file.name
    );


  const card =
    document.createElement("article");

  card.className =
    "sh-video-card";


  card.innerHTML = `

    <h3
      title="${esc(title)}"
    >
      ${esc(title)}
    </h3>

    <a
      href="${esc(imageUrl)}"
      target="_blank"
      rel="noopener"
      class="sh-player"
      style="display:block;"
    >

      <img
        src="${esc(imageUrl)}"
        loading="lazy"
        alt="${esc(title)}"
      >

    </a>

    <div
      class="sh-media-name"
      title="${esc(file.name)}"
    >
      ${esc(filename)}
    </div>

  `;


  const image =
    card.querySelector("img");


  image.addEventListener(
    "error",
    function(){

      image.style.display =
        "none";

    }
  );


  return card;

}


/* =========================================================
   MAKE MEDIA CARD
   ========================================================= */

function makeCard(
  item,
  file
){

  if(
    isVideo(file.name)
  ){

    return makeVideoCard(
      item,
      file
    );

  }


  if(
    isImage(file.name)
  ){

    return makeImageCard(
      item,
      file
    );

  }


  return null;

}


/* =========================================================
   MERGE KNOWN FILES + DISCOVERED FILES
   ========================================================= */

function mergeFiles(
  item,
  category
){

  const discovered =
    (item.files || [])
      .filter(function(file){

        return (
          file &&
          file.name &&
          !/^__ia_thumb\.jpg$/i.test(
            file.name
          ) &&
          (
            isVideo(file.name) ||
            isImage(file.name)
          )
        );

      });


  const map =
    new Map(
      discovered.map(
        file => [
          file.name,
          file
        ]
      )
    );


  const result = [];


  /* -------------------------------------------------------
     Put manually specified files first
     ------------------------------------------------------- */

  (category.knownFiles || [])
    .forEach(function(filename){

      if(
        map.has(filename)
      ){

        result.push(
          map.get(filename)
        );

        map.delete(filename);

      }

      else{

        /*
          Even if metadata doesn't currently
          return the file, keep it.
        */

        result.push({
          name:filename
        });

      }

    });


  /* -------------------------------------------------------
     Add automatically discovered files
     ------------------------------------------------------- */

  Array.from(
    map.values()
  )
  .sort(
    function(a,b){

      return String(a.name)
        .localeCompare(
          String(b.name)
        );

    }
  )
  .forEach(function(file){

    result.push(file);

  });


  return result;

}


/* =========================================================
   CATEGORY SECTION
   ========================================================= */

function buildSection(
  category,
  media
){

  const section =
    document.createElement("section");

  section.className =
    "sh-category";


  section.innerHTML = `

    <div class="sh-category-head">

      <div>

        <h2 class="sh-category-title">
          ${esc(category.title)}
        </h2>

        <p class="sh-category-subtitle">
          ${esc(category.subtitle)}
        </p>

      </div>

      <a
        class="sh-more-btn"
        href="${archiveItemUrl(category.id)}"
        target="_blank"
        rel="noopener"
      >
        Open Archive ↗
      </a>

    </div>

    <div
      class="sh-category-grid"
    ></div>

    <div
      class="sh-more-wrap"
    ></div>

  `;


  const grid =
    section.querySelector(
      ".sh-category-grid"
    );

  const more =
    section.querySelector(
      ".sh-more-wrap"
    );


  let shown = 0;


  function renderMore(){

    const count =
      shown === 0
      ? INITIAL
      : STEP;


    const end =
      Math.min(
        shown + count,
        media.length
      );


    media
      .slice(
        shown,
        end
      )
      .forEach(function(data){

        const card =
          makeCard(
            data.item,
            data.file
          );

        if(card){

          grid.appendChild(
            card
          );

        }

      });


    shown = end;


    more.innerHTML = "";


    if(
      shown < media.length
    ){

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "sh-more-btn";

      button.textContent =
        "More " +
        category.title +
        " (" +
        (media.length - shown) +
        ")";


      button.addEventListener(
        "click",
        renderMore
      );


      more.appendChild(
        button
      );

    }

  }


  renderMore();


  return section;

}


/* =========================================================
   EMPTY SECTION
   ========================================================= */

function emptySection(
  category
){

  const section =
    document.createElement(
      "section"
    );

  section.className =
    "sh-category";


  section.innerHTML = `

    <div class="sh-category-head">

      <div>

        <h2 class="sh-category-title">
          ${esc(category.title)}
        </h2>

        <p class="sh-category-subtitle">
          ${esc(category.subtitle)}
        </p>

      </div>

      <a
        class="sh-more-btn"
        href="${archiveItemUrl(category.id)}"
        target="_blank"
        rel="noopener"
      >
        Open Archive ↗
      </a>

    </div>

    <div class="sh-category-empty">

      No supported video/photo files found
      in this Archive item.

    </div>

  `;


  return section;

}


/* =========================================================
   LOAD GALLERY
   ========================================================= */

async function load(){

  status(
    "loading",
    "Fetching videos & photos from Internet Archive…"
  );


  refresh.disabled =
    true;


  container.innerHTML = "";


  let total = 0;

  let successful = 0;


  for(
    const category of CATEGORIES
  ){

    try{

      const item =
        await getItem(
          category.id
        );


      const files =
        mergeFiles(
          item,
          category
        );


      if(files.length){

        const media =
          files.map(
            function(file){

              return {
                item:item,
                file:file
              };

            }
          );


        container.appendChild(
          buildSection(
            category,
            media
          )
        );


        total +=
          files.length;

        successful++;

      }

      else{

        container.appendChild(
          emptySection(
            category
          )
        );

      }

    }

    catch(error){

      console.error(
        "Internet Archive error:",
        category.id,
        error
      );


      /*
        Important:

        Even when metadata fails,
        manually supplied known files
        can still be displayed.
      */

      if(
        (category.knownFiles || [])
          .length
      ){

        const fallbackItem = {

          metadata:{
            identifier:
              category.id,

            title:
              category.title

          }

        };


        const media =
          category.knownFiles
            .map(function(filename){

              return {

                item:
                  fallbackItem,

                file:{
                  name:
                    filename
                }

              };

            });


        container.appendChild(
          buildSection(
            category,
            media
          )
        );


        total +=
          media.length;

        successful++;

      }

      else{

        const section =
          document.createElement(
            "section"
          );

        section.className =
          "sh-category";


        section.innerHTML = `

          <div class="sh-category-head">

            <div>

              <h2 class="sh-category-title">
                ${esc(category.title)}
              </h2>

              <p class="sh-category-subtitle">
                ${esc(category.subtitle)}
              </p>

            </div>

            <a
              class="sh-more-btn"
              href="${archiveItemUrl(category.id)}"
              target="_blank"
              rel="noopener"
            >
              Open Archive ↗
            </a>

          </div>

          <div class="sh-category-empty">

            Could not read this Archive item
            right now.

            <br><br>

            <a
              href="${archiveItemUrl(category.id)}"
              target="_blank"
              rel="noopener"
            >
              Open on Internet Archive ↗
            </a>

          </div>

        `;


        container.appendChild(
          section
        );

      }

    }

  }


  if(successful){

    status(
      "",
      "Synced — " +
      total +
      " media file(s) across " +
      successful +
      " categories"
    );

  }

  else{

    status(
      "error",
      "Internet Archive data could not be loaded"
    );

  }


  refresh.disabled =
    false;

}


/* =========================================================
   REFRESH
   ========================================================= */

refresh.addEventListener(
  "click",
  load
);


/* =========================================================
   START
   ========================================================= */

load();

})();
</script>
