<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sutra Health - Video Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
.sh-gallery{
  --sh-teal-900:#0b4a45;--sh-teal-700:#0F766E;--sh-teal-500:#1a9e94;
  --sh-teal-100:#e6f4f2;--sh-sand-50:#f6f8fa;--sh-ink-900:#1c2b2a;
  --sh-ink-500:#6b7c7a;--sh-line:#e6ebe9;--sh-amber:#f2a341;--sh-gold:#d4af6a;
  font-family:Inter,sans-serif;background:var(--sh-sand-50);color:var(--sh-ink-900);
  display:block;width:100%;
}
.sh-gallery,.sh-gallery *{box-sizing:border-box}
.sh-gallery p,.sh-gallery h1,.sh-gallery h2,.sh-gallery h3{margin:0;padding:0}
.sh-gallery .sh-hero{
  background:radial-gradient(circle at 15% 15%,rgba(212,175,106,.2),transparent 45%),
  radial-gradient(circle at 85% 25%,rgba(255,255,255,.14),transparent 50%),
  linear-gradient(135deg,var(--sh-teal-900),var(--sh-teal-700) 55%,var(--sh-teal-500));
  color:#fff;padding:76px 20px 68px;text-align:center;position:relative;overflow:hidden
}
.sh-gallery .sh-hero h1{font-family:'Playfair Display',serif;font-size:clamp(32px,4.4vw,48px);margin:0 0 14px;line-height:1.18;position:relative}
.sh-gallery .sh-hero-eyebrow{display:inline-flex;gap:8px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sh-gold);font-weight:600;margin-bottom:14px;position:relative}
.sh-gallery .sh-hero-eyebrow:before,.sh-gallery .sh-hero-eyebrow:after{content:"";width:22px;height:1px;background:var(--sh-gold);opacity:.7;margin-top:7px}
.sh-gallery .sh-hero-sub{opacity:.92;font-size:17px;color:#eafaf7;max-width:620px;margin:0 auto;line-height:1.6;position:relative}
.sh-gallery .sh-hero-actions{position:relative;margin-top:30px;display:flex;justify-content:center}
.sh-gallery .sh-drive-link{display:inline-flex;align-items:center;background:rgba(255,255,255,.97);color:var(--sh-teal-900);font-weight:600;font-size:14.5px;padding:12px 22px;border-radius:999px;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.sh-gallery .sh-container{max-width:1240px;margin:0 auto;padding:54px 20px 64px;width:100%}
.sh-gallery .sh-sync-bar{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:40px;font-size:14px;color:var(--sh-ink-500);flex-wrap:wrap}
.sh-gallery .sh-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.15);display:inline-block}
.sh-gallery .sh-dot.loading{background:var(--sh-amber);animation:sh-pulse 1.2s infinite}
.sh-gallery .sh-dot.error{background:#ef4444}
@keyframes sh-pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sh-gallery .sh-refresh-btn,.sh-more-btn{border:1px solid var(--sh-teal-700);background:#fff;color:var(--sh-teal-700);font-weight:600;font-size:13px;padding:8px 16px;border-radius:999px;cursor:pointer}
.sh-gallery .sh-refresh-btn:hover,.sh-more-btn:hover{background:var(--sh-teal-700);color:#fff}
.sh-category{margin-bottom:48px}
.sh-category-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px;gap:16px}
.sh-category-title{color:var(--sh-teal-900);font-family:'Playfair Display',serif;font-size:28px;line-height:1.2}
.sh-category-subtitle{margin-top:5px!important;color:var(--sh-ink-500);font-size:13px}
.sh-category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.sh-video-card{background:#fff;border-radius:16px;padding:10px;box-shadow:0 1px 2px rgba(15,118,110,.04),0 14px 32px rgba(15,118,110,.09);border:1px solid var(--sh-line);transition:.22s}
.sh-video-card:hover{transform:translateY(-5px);box-shadow:0 24px 44px rgba(15,118,110,.16)}
.sh-video-card h3{color:var(--sh-teal-900);margin:4px 0 10px!important;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-player{border-radius:14px;overflow:hidden;background:#071514;aspect-ratio:16/9;width:100%;position:relative}
.sh-player video,.sh-player img{width:100%;height:100%;display:block;object-fit:cover}
.sh-player video{position:absolute;inset:0}
.sh-media-name{margin:7px 2px 0;color:var(--sh-ink-500);font-size:10.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-category-empty{padding:28px;background:#fff;border:1px dashed var(--sh-line);border-radius:16px;color:var(--sh-ink-500);text-align:center}
.sh-more-wrap{display:flex;justify-content:center;margin-top:20px}
.sh-more-btn{padding:9px 20px}
.sh-loading{padding:24px;text-align:center;color:var(--sh-ink-500)}
.sh-image-link{display:block;height:100%}
.sh-fallback-poster{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:#d9efeb;font-size:12px;background:linear-gradient(135deg,#0b4a45,#123f3c)}
@media(max-width:1000px){.sh-category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){
  .sh-gallery .sh-hero{padding:52px 20px 44px}.sh-gallery .sh-hero h1{font-size:28px}
  .sh-gallery .sh-container{padding:38px 16px 44px}.sh-category-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="navbar"></div>

<div class="sh-gallery">
<section class="sh-hero">
  <span class="sh-hero-eyebrow">Sutra Health</span>
  <h1>Video Gallery</h1>
  <p class="sh-hero-sub">Watch our wellness and lifestyle programs directly on our website — synced automatically from Internet Archive.</p>
  <div class="sh-hero-actions">
    <a class="sh-drive-link" href="https://archive.org/details/@sutra_health" target="_blank" rel="noopener">Visit Our Archive ↗</a>
  </div>
</section>

<div class="sh-container">
  <div class="sh-sync-bar">
    <span class="sh-dot loading" id="shSyncDot"></span>
    <span id="shSyncText">Connecting to Internet Archive…</span>
    <button class="sh-refresh-btn" id="shRefreshBtn" type="button">↻ Refresh</button>
  </div>
  <div id="shCategoryContainer"></div>
</div>
</div>

<div id="footer"></div>
<script src="/js/include.js"></script>

<script>
(function(){
  /*
    Exact public Archive files supplied by the site owner are listed first.
    The metadata API then discovers additional supported media in each item.
  */
  const CATEGORIES = [
    {
      title:"Nature", subtitle:"Nature and outdoor wellness", id:"nature_202609",
      knownFiles:[]
    },
    {
      title:"Yoga", subtitle:"Yoga sequences and practice", id:"yoga-sequence",
      knownFiles:["Yoga/yoga_asana/2026-06-13_shashankasana.mp4"]
    },
    {
      title:"Lifestyle · Nature", subtitle:"Sutra Health lifestyle and nature", id:"sutra_health_lifestyle_nature",
      knownFiles:["sutra_health_nature_02-07-2026.mp4"]
    },
    {
      title:"Lifestyle · Food", subtitle:"Food and healthy lifestyle content", id:"sutra_health_lifestyle_food",
      knownFiles:[]
    },
    {
      title:"Clinic & Wellness", subtitle:"Clinic, wellness and program videos", id:"30-06-2026_202609",
      knownFiles:["clinic/02-04-2026-2.mp4"]
    },
    {
      title:"Clinic", subtitle:"Clinic videos", id:"lifestyle_clinic",
      knownFiles:["Clinic/2025-07-05.mp4"]
    },
    {
      title:"Practitioner Experiences", subtitle:"Follower and practitioner experiences", id:"lifestyle-practitioners-experience",
      knownFiles:["follower-experience/arthritis_2025-04-09-2.mp4"]
    }
  ];

  const INITIAL=4, STEP=4;
  const container=document.getElementById("shCategoryContainer");
  const dot=document.getElementById("shSyncDot");
  const statusText=document.getElementById("shSyncText");
  const refresh=document.getElementById("shRefreshBtn");

  function status(state,msg){dot.className="sh-dot "+(state||"");statusText.textContent=msg}
  function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
  function mediaUrl(id,file){return "https://archive.org/download/"+encodeURIComponent(id)+"/"+file.split("/").map(encodeURIComponent).join("/")}
  function archiveItemUrl(id){return "https://archive.org/details/"+encodeURIComponent(id)}
  function thumbUrl(id){return "https://archive.org/services/img/"+encodeURIComponent(id)}
  function thumbFileUrl(id){return mediaUrl(id,"__ia_thumb.jpg")}
  function isVideo(name){return /\.(mp4|webm|mov|m4v|ogv)$/i.test(name)}
  function isImage(name){return /\.(jpg|jpeg|png|webp|gif|avif)$/i.test(name)}

  async function getItem(id){
    const r=await fetch("https://archive.org/metadata/"+encodeURIComponent(id),{
      cache:"no-store",headers:{Accept:"application/json"}
    });
    if(!r.ok)throw new Error(id+" HTTP "+r.status);
    return r.json();
  }

  function placeholder(card,label){
    const p=card.querySelector(".sh-fallback-poster");
    if(p){p.style.display="flex";p.textContent=label||"Sutra Health media"}
  }

  function makeCard(item,file){
    const id=item.metadata?.identifier||item.identifier;
    const itemTitle=item.metadata?.title||id;
    const filename=file.name.split("/").pop();
    const url=mediaUrl(id,file.name);
    const card=document.createElement("article");
    card.className="sh-video-card";

    if(isVideo(file.name)){
      card.innerHTML=
        '<h3 title="'+esc(itemTitle)+'">'+esc(itemTitle)+'</h3>'+
        '<div class="sh-player">'+
          '<video controls playsinline preload="metadata" poster="'+esc(thumbUrl(id))+'">'+
            '<source src="'+esc(url)+'">'+
          '</video>'+
          '<div class="sh-fallback-poster"></div>'+
        '</div>'+
        '<div class="sh-media-name" title="'+esc(file.name)+'">'+esc(filename)+'</div>';

      const video=card.querySelector("video");
      const fallback=card.querySelector(".sh-fallback-poster");

      // Try Archive item thumbnail first, then the common __ia_thumb.jpg.
      const test=new Image();
      test.onload=()=>{video.poster=thumbUrl(id)};
      test.onerror=()=>{
        const test2=new Image();
        test2.onload=()=>{video.poster=thumbFileUrl(id)};
        test2.onerror=()=>{fallback.style.display="flex"};
        test2.src=thumbFileUrl(id);
      };
      test.src=thumbUrl(id);

      video.addEventListener("error",()=>{
        fallback.style.display="flex";
        fallback.textContent="Video unavailable — open on Internet Archive ↗";
        fallback.style.cursor="pointer";
        fallback.onclick=()=>window.open(archiveItemUrl(id),"_blank","noopener");
      });
    }else{
      card.innerHTML=
        '<h3 title="'+esc(itemTitle)+'">'+esc(itemTitle)+'</h3>'+
        '<a class="sh-player sh-image-link" href="'+esc(url)+'" target="_blank" rel="noopener">'+
          '<img src="'+esc(url)+'" loading="lazy" alt="'+esc(itemTitle)+'">'+
        '</a>'+
        '<div class="sh-media-name" title="'+esc(file.name)+'">'+esc(filename)+'</div>';
      const img=card.querySelector("img");
      img.onerror=()=>{img.style.display="none";placeholder(card,"Image unavailable — open on Internet Archive ↗")};
    }
    return card;
  }

  function emptySection(category,msg){
    const sec=document.createElement("section");
    sec.className="sh-category";
    sec.innerHTML='<div class="sh-category-head"><div><h2 class="sh-category-title">'+esc(category.title)+'</h2><p class="sh-category-subtitle">'+esc(category.subtitle)+'</p></div></div>'+
      '<div class="sh-category-empty">'+msg+'</div>';
    return sec;
  }

  function buildSection(category,media){
    const sec=document.createElement("section");
    sec.className="sh-category";
    sec.innerHTML='<div class="sh-category-head"><div><h2 class="sh-category-title">'+esc(category.title)+'</h2><p class="sh-category-subtitle">'+esc(category.subtitle)+'</p></div></div>'+
      '<div class="sh-category-grid"></div><div class="sh-more-wrap"></div>';
    const grid=sec.querySelector(".sh-category-grid"),more=sec.querySelector(".sh-more-wrap");
    let shown=0;

    function renderMore(){
      const end=Math.min(shown+(shown===0?INITIAL:STEP),media.length);
      media.slice(shown,end).forEach(x=>grid.appendChild(makeCard(x.item,x.file)));
      shown=end;
      more.innerHTML="";
      if(shown<media.length){
        const btn=document.createElement("button");
        btn.type="button";btn.className="sh-more-btn";
        btn.textContent="More "+category.title+" ("+(media.length-shown)+")";
        btn.onclick=renderMore;more.appendChild(btn);
      }
    }
    renderMore();
    return sec;
  }

  function mergeFiles(item,category){
    const discovered=(item.files||[]).filter(f=>f&&f.name&&!/^__ia_thumb\.jpg$/i.test(f.name)&&(isVideo(f.name)||isImage(f.name)));
    const map=new Map(discovered.map(f=>[f.name,f]));
    const result=[];
    (category.knownFiles||[]).forEach(name=>{
      if(map.has(name)){result.push(map.get(name));map.delete(name)}
      else result.push({name});
    });
    Array.from(map.values()).sort((a,b)=>String(a.name).localeCompare(String(b.name))).forEach(f=>result.push(f));
    return result;
  }

  async function load(){
    status("loading","Fetching videos & photos from Internet Archive…");
    refresh.disabled=true;container.innerHTML="";
    let total=0,successful=0;

    for(const category of CATEGORIES){
      try{
        const item=await getItem(category.id);
        const files=mergeFiles(item,category);
        if(files.length){
          container.appendChild(buildSection(category,files.map(file=>({item,file}))));
          total+=files.length;successful++;
        }else{
          container.appendChild(emptySection(category,"No supported video/photo files found in this Archive item."));
        }
      }catch(error){
        console.error("Internet Archive error:",category.id,error);
        // If metadata is temporarily unavailable, still show exact known files.
        if((category.knownFiles||[]).length){
          const fallbackItem={metadata:{identifier:category.id,title:category.title}};
          const media=category.knownFiles.map(name=>({item:fallbackItem,file:{name}}));
          container.appendChild(buildSection(category,media));
          total+=media.length;successful++;
        }else{
          container.appendChild(emptySection(category,
            'Could not read this Archive item right now.<br><a href="'+archiveItemUrl(category.id)+'" target="_blank" rel="noopener">Open on Internet Archive ↗</a>'
          ));
        }
      }
    }

    status(successful?"":"error",successful?
      "Synced — "+total+" media file(s) across "+successful+" categories":
      "Internet Archive data could not be loaded");
    refresh.disabled=false;
  }

  refresh.addEventListener("click",load);
  load();
})();
</script>
</body>
</html>
